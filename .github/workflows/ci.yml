name: CI

on:
  push:
    branches:
      - main

  pull_request:

env:
  FFMPEG_BUILD: ffmpeg-n8.1-latest-linux64-gpl-8.1

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      matrix:
        ruby: [ '4.0', '3.4', '3.3' ]
        chrome: [ 'stable' ]
        include:
          # The last version without Page.startScreenRecording, to cover the screencast fallback.
          - ruby: '4.0'
            chrome: '152'

    name: build (ruby ${{ matrix.ruby }}, chrome ${{ matrix.chrome }})

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: true
    - name: Cache ffmpeg
      id: cache-ffmpeg
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.local/bin/ffmpeg
        key: ffmpeg-${{ runner.os }}-${{ env.FFMPEG_BUILD }}
    - name: Install ffmpeg
      if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
      run: |
        mkdir -p "$HOME/.local/bin"
        curl -fsSL -o "$RUNNER_TEMP/ffmpeg.tar.xz" \
          "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/${FFMPEG_BUILD}.tar.xz"
        tar -xJf "$RUNNER_TEMP/ffmpeg.tar.xz" -C "$RUNNER_TEMP" "${FFMPEG_BUILD}/bin/ffmpeg"
        mv "$RUNNER_TEMP/${FFMPEG_BUILD}/bin/ffmpeg" "$HOME/.local/bin/ffmpeg"
    - name: Set up ffmpeg
      run: |
        chmod +x "$HOME/.local/bin/ffmpeg"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
    - name: Use Chrome ${{ matrix.chrome }}
      if: matrix.chrome != 'stable'
      run: |
        install() { npx -y @puppeteer/browsers install "$1@${{ matrix.chrome }}" --path "$RUNNER_TEMP/browsers" | tail -n 1 | cut -d ' ' -f 2; }
        echo "CHROME_BIN=$(install chrome)" >> "$GITHUB_ENV"
        echo "SE_CHROMEDRIVER=$(install chromedriver)" >> "$GITHUB_ENV"
        # Chrome for Testing is not installed under /opt, so AppArmor blocks its sandbox.
        sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
    - name: Run test
      run: bundle exec rake
